<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }} · {{ site.data.profile.location }}</p>
    <ul class="footer-links">
      {%- for link in site.data.profile.links %}
      <li><a href="{{ link.url }}" aria-label="{{ link.name }}" title="{{ link.name }}" {% unless link.url contains 'mailto' %}target="_blank" rel="noopener"{% endunless %}>{% include icon.html name=link.icon %}</a></li>
      {%- endfor %}
    </ul>
  </div>
</footer>
