<header class="site-header">
  <nav class="nav container" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">TB</span>
      <span class="brand-name">{{ site.data.profile.name }}</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
      <span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="{{ '/#about' | relative_url }}">About</a></li>
      <li><a href="{{ '/#publications' | relative_url }}">Publications</a></li>
      <li><a href="{{ '/#experience' | relative_url }}">Experience</a></li>
      <li><a href="{{ '/#teaching' | relative_url }}">Teaching</a></li>
      <li><a href="{{ '/#education' | relative_url }}">Education</a></li>
      <li><a class="nav-cv" href="{{ site.data.profile.cv | relative_url }}" target="_blank" rel="noopener">CV</a></li>
      <li>
        <button class="theme-toggle" aria-label="Toggle dark mode">
          <span class="when-light">{% include icon.html name="moon" %}</span>
          <span class="when-dark">{% include icon.html name="sun" %}</span>
        </button>
      </li>
    </ul>
  </nav>
</header>
