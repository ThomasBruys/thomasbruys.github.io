tagline: >-
  Building trustworthy, confidence-aware AI for large-scale, real-world systems.

bio: >-
  I'm a third-year Ph.D. student in Electrical and Computer Engineering at
  Georgia Tech and a Graduate Research Assistant at
  <a href="https://www.ai4opt.org/">AI4OPT</a>. My research focuses on making
  AI systems <strong>know when they don't know</strong>: I develop
  uncertainty-quantification and conformal-prediction methods that give
  statistical guarantees to large language models, multi-agent systems and deep
  learning pipelines deployed in <strong>healthcare</strong> and
  <strong>supply chain</strong> settings.

bio_more: >-
  Before Georgia Tech, I earned a Master's of Engineering in Computer Science
  from IMT Atlantique in France and worked on hospital staff-scheduling
  optimization at Hopia in Paris.

interests:
  - Uncertainty Quantification
  - Conformal Prediction
  - Risk Control
  - Large Language Models
  - Multi-Agent Systems
  - AI for Healthcare
  - ML for Supply Chain


